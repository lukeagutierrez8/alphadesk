[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphadesk"
version = "0.1.0"
description = "A quant research desk for Claude Code: every idea through 13 checks run by code the model can't edit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
alphadesk = "alphadesk.cli:main"

[tool.setuptools.packages.find]
include = ["alphadesk*"]
